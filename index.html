<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- 关键：viewport-fit=cover 让 iPhone 灵动岛/全面屏的 env(safe-area-inset-*) 生效 -->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- v96：原来是 black-translucent（内容顶到状态栏底下、会被灵动岛盖住）。
     改成 default：iOS 给状态栏留独立空间，内容不再钻到灵动岛下面。
     另外 .main 加了 padding-top: env(safe-area-inset-top) 兜底（不重叠时该值为 0，不会重复留白）。 -->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5f0e8">
<title>日常集 · 生活工作台</title>
<!-- manifest 仅在 http/https（含 GitHub Pages）注入；file:// 双击打开因 origin=null 会触发 CORS，故跳过 -->
<script>
  if (location.protocol !== 'file:') {
    var _m = document.createElement('link');
    _m.rel = 'manifest'; _m.href = 'manifest.webmanifest';
    document.head.appendChild(_m);
  }
</script>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">

<!-- ===== 样式（拆分自原 HTML） ===== -->
<!-- v96r_fix：若地址带 ?_=时间戳（「抓取最新版本」在无 SW 时的兜底导航），给 style.css 加 ?v= 缓存击穿，强制拉最新样式 -->
<script>
(function(){
  var m=/[?&]_=([0-9]+)/.exec(location.search||'');
  var bust=m?('?v='+m[1]):'';
  var l=document.createElement('link');
  l.rel='stylesheet'; l.href='style.css'+bust;
  document.head.appendChild(l);
})();
</script>

<!-- ===== 致命错误可视化层（必须最前，捕获后续脚本一切错误） ===== -->
<script>
/* 全局致命错误可视化：把任何 JS 报错显示到页面，避免 iOS 主屏 standalone 白屏无信息。 */
(function(){
  function show(msg){
    var el=document.getElementById('__fatal');
    if(!el){
      el=document.createElement('div'); el.id='__fatal';
      el.style.cssText='position:fixed;inset:0;z-index:2147483647;background:#16181d;color:#ff7b7b;font:13px/1.6 ui-monospace,Menlo,Consolas,monospace;padding:18px;white-space:pre-wrap;overflow:auto;';
      (document.documentElement||document.body||document).appendChild(el);
      el.appendChild(document.createTextNode('【页面报错可视化】若此框出现，说明页面 JS 抛错（白屏根因）：\n'));
    }
    el.appendChild(document.createTextNode(msg+'\n'));
  }
  window.__fatalShow=show;
  window.addEventListener('error',function(e){
    show('[error] '+(e.message||e.error||e)+(e.filename?(' @ '+e.filename+':'+e.lineno+':'+e.colno):''));
  });
  window.addEventListener('unhandledrejection',function(e){
    var r=e.reason; show('[promise] '+((r&&(r.stack||r.message))||r));
  });
})();
</script>

<!-- ===== 设备检测（必须在纹理切换之前） ===== -->
<script>
(function(){
  try{
    var ua=navigator.userAgent||'';
    var mob=/iPhone|iPad|iPod|Android|webOS|BlackBerry|IEMobile|Opera Mini|Mobile/i.test(ua);
    var small=Math.min(window.innerWidth||9999, window.innerHeight||9999)<=820;
    var coarse=('ontouchstart' in window)||(navigator.maxTouchPoints>0);
    window.__IS_MOBILE__=(mob&&coarse)||(small&&coarse);
  }catch(e){ window.__IS_MOBILE__=false; }
})();
</script>
</head>
<body>

<div class="shell">
  <aside class="sidebar">
    <button class="brand" id="brandBtn" type="button">
      <i id="brandMark">日</i>
      <span style="flex:1"><b id="brandName">日常集</b><span id="brandTag">生活有迹可循</span></span>
    </button>
    <nav class="nav" id="nav"></nav>
    <div class="sep"></div>
    <div class="side-foot">
      <b>数据存在线上</b>
      换设备、换浏览器打开，<br>内容都还在。
    </div>
  </aside>

    <main class="main">
    <div class="tabbar" id="tabbar"></div>
    <header class="topbar">
      <div>
        <p class="eyebrow" id="mEyebrow">总览</p>
        <h1 id="mTitle">日常集</h1>
        <p class="sub" id="mDesc">把日子过成一册可以翻回去的东西。</p>
      </div>
      <div class="top-actions" id="mActions"></div>
    </header>

    <div class="offline" id="offlineBox"></div>
    <div class="syncbar" id="syncbar">
      <b id="syncText"></b>
      <button class="btn sm" type="button" id="syncRetry">重试同步</button>
      <button class="btn sm" type="button" id="syncDrop">放弃这些改动</button>
    </div>

    <div class="ghstatus" id="ghStatus" aria-live="polite"></div>

    <div id="stage"></div>
  </main>
</div>

<div class="backdrop" id="sheetHost" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- ===== 旅行地球：常驻宿主（不在 stage 内，避免 render 时被 innerHTML 销毁重建） ===== -->
<div class="globe-host" id="globeHost" hidden>
  <canvas id="earthCanvas" class="earth-canvas"></canvas>
  <div class="earth-overlay"><div class="earth-title">去过的地方，都亮起来了</div><div class="earth-sub" id="earthStat"></div></div>
  <div class="earth-legend">
    <i><u style="background:#e23b3b"></u>去过（小红旗）</i>
    <i><u style="background:#3aa55a"></u>想去（小草苗）</i>
  </div>
  <div class="earth-tip">拖动旋转 · 点亮的都是你去过 / 计划去的地方</div>
  <button id="globeRefresh" class="globe-refresh" type="button" title="重新加载已添加的目的地">↻ 刷新地球</button>
</div>

<!-- ===== 3D 地球 / 地图资源：v95 改为「按需加载」=====
     原来这里用 document.write 无条件注入地球贴图 + 边界数据 + three.js，
     每次打开首页都要下载约 11MB（手机端也一样），是首屏慢的主因。
     现在只注册一个加载器 ensureEarthAssets(cb)：等用户真正进入「遐方坞」
     模块时才去拉这些文件，全部就绪后回调。首屏不再背这 11MB。 -->

<script>
(function(){
  var loading=false, done=false, queue=[];
  window.earthAssetsReady=false;
  function list(){
    return [
      window.__IS_MOBILE__ ? 'earth_color_8k.js' : 'earth_color_16k.js',
      'earth_height_4k.js',
      'borders0.js',
      'borders1.js',
      'borders_cn_prov.js',
      'cities.js',
      'three.min.js'
    ];
  }
  function finish(){
    done=true; loading=false; window.earthAssetsReady=true;
    var q=queue.slice(); queue.length=0;
    q.forEach(function(fn){ try{ fn(); }catch(e){ console.error(e); } });
  }
  window.ensureEarthAssets=function(cb){
    if (typeof cb!=='function') cb=function(){};
    if (done){ cb(); return; }
    queue.push(cb);
    if (loading) return;
    loading=true;
    var files=list(), pending=files.length;
    files.forEach(function(src){
      var s=document.createElement('script'), settled=false;
      function tick(){ if(settled) return; settled=true; if(--pending<=0) finish(); }
      s.onload=tick;
      s.onerror=function(){ console.warn('[perf] 地球资源加载失败，已跳过：'+src); tick(); };
      s.src=src;
      document.head.appendChild(s);
    });
  };
})();
</script>

<!-- ===== 地球标记内联图标 + 主应用（three.js 已改为按需加载）===== -->
<script defer src="marker-icons.js"></script>
<!-- v96r_fix：不再写死 app.js；若地址带 ?_=时间戳（无 SW 兜底导航），给 app.js 加 ?v= 缓存击穿强制拉最新；
     同时清掉 ?_ 防止后续软刷新一直击穿。https 下无 ?_ 则正常走 SW 缓存。 -->
<script>
(function(){
  var m=/[?&]_=([0-9]+)/.exec(location.search||'');
  var bust=m?('?v='+m[1]):'';
  if(m&&history.replaceState){
    var ns=location.search.replace(/[?&]_=[0-9]+/,'').replace(/^&/,'?');
    history.replaceState(null,'',location.pathname+ns+location.hash);
  }
  var s=document.createElement('script');
  s.src='app.js'+bust; s.defer=true;
  document.head.appendChild(s);
})();
</script>

<!-- ===== Service Worker =====
  规则（v58 优化：开发期零缓存干扰，发布期保留离线/秒开）：
    • 仅在 https:// （如 ciaorz.github.io，含手机端）注册 SW，享受离线/秒开；
    • http://localhost 调试、file:// 双击、以及地址带 ?nosw 时，不注册并清掉已存在的 SW，
      保证调试期间永远拉最新文件、绝不返回旧缓存。
-->
<script>
(function(){
  if (!('serviceWorker' in navigator)) return;
  // file:// 双击打开：service worker 无安全上下文不生效，且会触发「Unsafe attempt to load URL」等报错，直接跳过整段
  if (location.protocol === 'file:') return;
  // ★ 总开关：v59 起 SW 改为「网络优先」，部署即刷新、离线仍可秒开，故默认开启；
  //   file:// 双击打开已在上方被 file: 守卫跳过，不影响本地调试。
  var SW_ENABLED = true;
  // ★ 调试期若想彻底关掉 SW，把这个改成 false 即可（全环境不启用，永远拉最新文件）；
  //   线上 https 自动启用，享受离线/PWA 秒开。需要「强制拉最新」时用同步设置里的按钮。
  var forceOff = /[?&]nosw\b/.test(location.search);
  // 是否启用 SW：总开关开启 + 必须是 https + 未加 ?nosw（localhost / file:// / ?nosw 一律关闭）
  var shouldEnable = SW_ENABLED && (location.protocol === 'https:') && !forceOff;

  function unregisterAll(done){
    navigator.serviceWorker.getRegistrations().then(function(regs){
      Promise.all(regs.map(function(r){ return r.unregister().catch(function(){}); }))
        .then(function(){ if (done) done(); }).catch(function(){ if (done) done(); });
    }).catch(function(){ if (done) done(); });
  }

  window.addEventListener('load', function () {
    if (shouldEnable) {
      /* v96o：撤销 v96m 的 updateViaCache:'none' —— 那个设置会强制浏览器每次都用
         cache:no-cache 去拉 sw.js，等于每次打开站点都白打一次网络请求（用户反馈浪费流量）。
         改回默认（'imports'）：sw.js 走 HTTP 缓存，没过期就直接命中/304，流量降到最低。
         新版本改为「用户手动点按钮」触发，见下方 __applySwUpdate；不点就不更新、不刷新。 */
      navigator.serviceWorker.register('sw.js').then(function (reg) {
        window.__swReg = reg;   /* 暴露给同步设置里的「抓取最新版本」按钮 */
        /* v96o：手动更新入口 —— 不自动刷新，只有用户点按钮才去拉最新 sw.js 并应用。
           返回 Promise：'up-to-date' / 'no-sw' / 'error' / 或已触发刷新（页面会重载，promise 不再 resolve）。 */
        window.__applySwUpdate = function () {
          return new Promise(function (resolve) {
            if (!reg) { resolve('no-sw'); return; }
            function skipAndReload(worker) {
              try {
                var ch = new MessageChannel();
                ch.port1.onmessage = function () { window.location.reload(); };
                worker.postMessage({ type: 'SKIP_WAITING' }, [ch.port2]);
              } catch (e) { window.location.reload(); }
            }
            if (reg.waiting) { skipAndReload(reg.waiting); return; }
            var fired = false;
            var uh = function () {
              fired = true;
              var nw = reg.installing;
              if (!nw) { resolve('up-to-date'); return; }
              nw.addEventListener('statechange', function () {
                if (nw.state === 'installed') {
                  reg.removeEventListener('updatefound', uh);
                  skipAndReload(nw);
                }
              });
            };
            reg.addEventListener('updatefound', uh);
            reg.update().then(function () {
              if (!fired) {
                reg.removeEventListener('updatefound', uh);
                if (reg.waiting) { skipAndReload(reg.waiting); }
                else { resolve('up-to-date'); }
              }
            }).catch(function () { resolve('error'); });
          });
        };
      }).catch(function(e){
        if (window.__fatalShow) window.__fatalShow('[SW] 注册失败（不影响页面打开）：' + (e && e.message ? e.message : e));
      });

      /* v96o：撤销 v83 的「SUBRES_UPDATED 自动刷新」。
         以前 SW 后台发现 app.js / style.css 有新版就静默重载页面——本质上还是自动更新，
         违背「手动」诉求。现在 SW 只在后台把新文件写进缓存（stale-while-revalidate），
         不触发任何刷新；由同步设置里的「抓取最新版本」按钮来真正换上新代码。 */

      // 直接加载未压缩的 app.js（本地开发，编辑即生效，不再需要单独构建 app.min.js）
    } else {
      // 调试/离线场景：清掉任何已安装的 SW，避免旧缓存继续作祟
      unregisterAll();
    }
  });
})();
</script>

</body>
</html>
